<!doctype html>
<!-- verify/jank-control.html — the deliberately janky control from
     verification-loop.md §4. Point the harness at this page ONCE per project:

       python3 -m http.server 8936 --bind 127.0.0.1 &
       node verify/perf.mjs http://127.0.0.1:8936/verify/jank-control.html --expect-fail

     Expected: INSTRUMENT OK (exit 0). The page blocks the main thread ~20ms per
     frame (~50fps — every 60Hz frame is long, so the >16.7ms rule must go to
     ~100%), animates `top` (layout thrash), and late-inserts a banner (CLS).
     Calibration point: under the WRONG one-threshold rule (>50ms only) this page
     passes at 0.0% — that is the defect this control exists to expose. A harness
     that reports this page green is broken, whatever it reports elsewhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jank control — must fail the frame budget</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; }
  h1 { font-size: 3rem; max-width: 28ch; }               /* a real LCP candidate */
  .mover { position: relative; width: 120px; height: 120px; background: #c33; }
  .filler { height: 60vh; background: #eee; margin: 1rem 0; }
</style>
</head>
<body>
  <h1>This page is deliberately janky. If the harness reports it green, the harness is broken.</h1>
  <div class="mover" id="mover"></div>
  <div class="filler"></div><div class="filler"></div><div class="filler"></div>
  <script>
    // ~20ms main-thread block per frame → ~50fps → every 60Hz frame is long.
    let y = 0, dir = 1
    function tick() {
      const t0 = performance.now()
      while (performance.now() - t0 < 20) { /* burn */ }
      y += dir * 2; if (y > 200 || y < 0) dir = -dir
      document.getElementById('mover').style.top = y + 'px'   // layout, not transform
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
    // Late-inserted element with no reserved space → real CLS.
    setTimeout(() => {
      const b = document.createElement('div')
      b.textContent = 'late banner — this shift is intentional'
      b.style.cssText = 'height:90px;background:#fc0;font-size:1.5rem;padding:1rem'
      document.body.insertBefore(b, document.body.firstChild.nextSibling)
    }, 800)
  </script>
</body>
</html>
